  function renderLogs() {
    const panel = element("section", null, { className:"panel" });
    panel.append(element("h2", "抓取執行紀錄"));
    const wrap = element("div", null, { className:"table-wrap" });
    const table = element("table");
    const head = element("tr");
    ["時間","狀態","抓取篇數","新增保存","重複剔除","方案上限略過"].forEach(label => head.append(element("th", label)));
    const thead = element("thead"); thead.append(head); table.append(thead);
    const body = element("tbody");
    const rows = Array.isArray(snapshot && snapshot.history) ? snapshot.history : [];
    rows.forEach(item => {
      const row = element("tr");
      [fmt(item.created_at), item.status || "—", item.fetched ?? item.requested ?? 0, item.inserted ?? item.saved ?? 0, item.duplicates ?? 0, item.skipped_limit ?? 0].forEach(value => row.append(element("td", String(value))));
      body.append(row);
    });
    if (!rows.length) { const row = element("tr"); const cell = element("td", "目前沒有執行紀錄", { colspan:"6", className:"empty" }); row.append(cell); body.append(row); }
    table.append(body); wrap.append(table); panel.append(wrap);
    return panel;
  }

  function renderSettings() {
    const panel = element("section", null, { className:"panel" });
    panel.append(element("h2", "設定與匯出"), element("p", "CSV／JSON 由擴充功能直接在目前 Chrome 產生，資料不會經過 GAS。", { className:"muted" }));
    const actions = element("div", null, { className:"actions" });
    const selectedPosts = () => localPosts().filter(post => selectedKeys.has(String(post.uid || post.post_id || post.post_url || "")));
    const exportRows = async format => {
      const rows = selectedPosts();
      if (!rows.length) throw new Error("請先在文案庫選擇文章");
      await bridge("BRIDGE_EXPORT_SELECTED", { uids:rows.map(post => post.uid), format });
    };
    actions.append(
      element("button", "匯出已選 CSV", { onClick:() => exportRows("csv").catch(showError) }),
      element("button", "匯出已選 JSON", { onClick:() => exportRows("json").catch(showError) })
    );
    panel.append(actions);
    return panel;
  }

  function render() {
    clearError();
    $("title").textContent = titles[page] || titles.overview;
    document.querySelectorAll("#nav button").forEach(button => button.classList.toggle("active", button.dataset.page === page));
    const auth = snapshot && snapshot.auth || {};
    $("user-label").textContent = auth.signed_in ? `${auth.email || "已登入"}｜${auth.label || auth.plan || "Free"}` : "尚未登入";
    $("login").textContent = auth.signed_in ? "Google 登出" : "Google 登入";
    $("sync-usage").disabled = !auth.signed_in || !sessionToken();
    const renderers = { overview:renderOverview, library:renderLibrary, analysis:renderAnalysis, "cat-card":renderCatCard, logs:renderLogs, settings:renderSettings };
    $("content").replaceChildren((renderers[page] || renderOverview)());
  }

  async function buildUsageItems(posts) {
    const values = [];
    const seen = new Set();
    for (const post of posts) {
      const source = postKeySource(post);
      if (!source || source.endsWith(":")) continue;
      const postKey = await sha256(source);
      if (seen.has(postKey)) continue;
      seen.add(postKey);
      values.push({ post_key:postKey, key_version:"sha256-post-v1" });
    }
    return values.sort((left, right) => left.post_key.localeCompare(right.post_key));
  }

  async function syncUsage() {
    const token = sessionToken();
    if (!token) throw new Error("新版登入憑證尚未建立，需更新擴充功能後才能同步額度");
    const items = await buildUsageItems(localPosts());
    if (!items.length) { usageState = await server("getUsageState", { sessionToken:token }); render(); return; }
    let last = null;
    for (let index = 0; index < items.length; index += 100) {
      const chunk = items.slice(index, index + 100);
      const digest = await sha256(`${snapshot.auth.email || "member"}\n${chunk.map(item => item.post_key).join("\n")}`);
      const batchId = `portal:${digest.slice(7, 39)}:${String(index / 100).padStart(3, "0")}`;
      last = await server("submitUsageBatch", {
        sessionToken:token,
        batchId,
        items:chunk,
        extensionVersion:snapshot.extension_version || ""
      });
      if (!last || !last.ok) throw new Error(last && last.error || "後台沒有確認這次同步");
    }
    usageState = last;
    const batch = last.batch;
    showStatus(last.idempotent
      ? `後台已確認：此批次已同步｜累積 ${last.usage.used}／${last.usage.limit}`
      : `後台已確認：本次新增 ${batch.new_count}｜重複 ${batch.duplicate_count}｜累積 ${last.usage.used}／${last.usage.limit}`);
    render();
  }

  async function load() {
    clearError(); hideStatus();
    try {
      snapshot = await bridge("BRIDGE_SNAPSHOT");
      prepareFrontendAnalysis();
      $("subtitle").textContent = `資料只從目前 Chrome 讀取｜最近更新 ${new Date().toLocaleString("zh-TW")}`;
      if (sessionToken()) await syncUsage();
      render();
    } catch (error) {
      snapshot = snapshot || { auth:{ signed_in:false }, posts:[], history:[] };
      prepareFrontendAnalysis();
      render();
      showError(error.message || "主控台載入失敗");
    }
  }

  document.querySelectorAll("#nav button").forEach(button => button.addEventListener("click", () => {
    page = button.dataset.page;
    history.replaceState(null, "", `?page=${page}`);
    render();
  }));
  $("refresh").addEventListener("click", load);
  $("sync-usage").addEventListener("click", () => syncUsage().catch(showError));
  $("login").addEventListener("click", async () => {
    try {
      const signedIn = snapshot && snapshot.auth && snapshot.auth.signed_in;
      await bridge(signedIn ? "BRIDGE_LOGOUT" : "BRIDGE_LOGIN");
      await load();
    } catch (error) { showError(error.message); }
  });
  if (!titles[page]) page = "overview";
  load();
})();
</script>
