      "三、選題到 CTA 拆解：整理主題、Hook／開頭、承諾、正文結構、證據、情緒轉折、結尾與 CTA；指出哪些寫法值得保留，哪些只是表面互動。",
      "四、轉換路徑：檢查內容是否完成注意力 → 共鳴／信任 → 行動；判斷 CTA 是只要求按讚留言，還是能把讀者導向清楚的下一步。",
      "五、心理與傳播：從資訊缺口、身份認同、實用價值、故事性與可轉述性分析停留、留言、收藏與分享的理由，並指出最可能的分享動機。",
      "六、逐篇診斷：挑出代表性文案，逐篇指出 Hook、承諾、證據、結尾與 CTA 的具體問題和可保留處。引用原句時保留原文，不要先替它改寫。",
      "七、演算法風險檢查：逐項檢查 R1 互動誘餌、R2 Clickbait、R3 首句與正文不一致、R4 搬運或低原創、R5 連續同主題、R6 低品質外部連結、R7 敏感議題聳動表述、R8 負面回饋、R9 主題混雜、R10 未標示 AI、R11 圖文不一致、R12 軟性降權。沒有命中就寫「未發現」，不要把推測寫成平台確定規則。",
      "八、AI 味檢查：找出過度工整、空泛、模板化或不像真人說話的句子，說明判斷依據；不要把自然口語誤判成 AI。",
      "九、優先行動與測試：提出 3 個依優先順序排列的調整，每個都包含「改哪裡／為什麼／如何測試／看什麼結果」；最後提出 3 組 2＋1 題目（同一核心拆成兩篇測試，再用一篇承接行動）。",
      "輸出原則：每個結論都要連回文案或互動數字；建議要指出原句位置與具體方向；先求有，再透過測試逐步優化。",
      "檔案使用原則：只分析 scope 為 my_account 的自己的 Threads 文案；不可讀取或推測其他帳號內容，也不要捏造不存在的貼文。"
    ].join("\n");
  }

  function frontendStatsTestPayload(){
    const email=String(snapshot?.auth?.email||"").trim().toLowerCase(),analysis=frontendAnalysis||buildFrontendAnalysis(snapshot);
    if(!email||!analysis.sample_count)return null;
    const payload=buildAnalysisSyncPayload(snapshot,analysis),latest=payload.latest_scrape||{};
    return {api_version:"v1",action:"recordFrontendStatsTest",test_channel:"frontend_stats_test_v1",reported_email:email,reported_origin:location.origin,extension_version:String(snapshot?.extension_version||"unknown"),analysis_version:payload.analysis_version,computed_at:payload.computed_at,sync_id:payload.sync_id,source_post_count:payload.source_post_count,sample_count:payload.sample_count,duplicate_count:payload.duplicate_count,total_likes:payload.totals.likes,total_replies:payload.totals.replies,total_reposts:payload.totals.reposts,total_quotes:payload.totals.quotes,total_interactions:payload.totals.total_interactions,latest_fetched:latest.fetched,latest_inserted:latest.inserted,latest_duplicates:latest.duplicates,latest_updated:latest.updated,latest_skipped_limit:latest.skipped_limit};
  }
  function syncFrontendStatsTest(){
    if(frontendStatsTestSync)return frontendStatsTestSync;
    const payload=frontendStatsTestPayload();
    if(!payload)return Promise.resolve(false);
    if(payload.sync_id===frontendStatsTestLastSyncId)return Promise.resolve(true);
    frontendStatsTestSync=fetch(FRONTEND_STATS_TEST_URL,{method:"POST",mode:"no-cors",credentials:"omit",cache:"no-store",keepalive:true,headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}).then(()=>{frontendStatsTestLastSyncId=payload.sync_id;return true}).catch(()=>false).finally(()=>{frontendStatsTestSync=null});
    return frontendStatsTestSync;
  }
